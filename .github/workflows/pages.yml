name: Studio Pages
on:
  push:
    paths:
      - index.html
      - landing.html
      - assets/**
      - build_site.py
      - prepare_graphics_assets.py
      - feeds.py
      - article_photo.py
      - requirements.txt
      - .github/workflows/pages.yml
  workflow_dispatch:
  schedule:
    - cron: '11 */4 * * *'

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python build_site.py
        env:
          AUTOPILOT_SCHEDULE: ${{ vars.AUTOPILOT_SCHEDULE }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          SOCIAL_PUBLISHER_URL: ${{ vars.SOCIAL_PUBLISHER_URL || 'https://avi-studio-publisher.avinasha-vagarnal.workers.dev' }}
      - run: python prepare_graphics_assets.py _site/assets/vision
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages

name: Article photo
on:
  workflow_dispatch:
    inputs:
      article_url:
        description: Public article URL from a supported news publisher
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fetch the article draft and photo
        env:
          ARTICLE_URL: ${{ inputs.article_url }}
        run: python article_photo.py --draft --url "$ARTICLE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: article-photo
          path: output/article-photo/
          retention-days: 3
          if-no-files-found: error

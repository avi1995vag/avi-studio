name: Verify
on:
  push:
    branches-ignore: [autopilot-history]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: node --check assets/creative.js && node --check assets/photo-search.js && node --check assets/article-import.js && node --check assets/studio.js && node --check assets/image-generator.js && node --check assets/workspace.js
      - run: node --check assets/creator-tools.js && node --check assets/landing.js
      - run: node --check assets/social-publishing.js && node --test publishing/worker.test.mjs tests/carousel-layouts.test.mjs
      - run: python build_site.py --offline
      - run: python main.py --sample
